services:

  backend:
    build: ./backend
    container_name: fastapi_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: react_frontend

    ports:
      - "5173:5173"

    # volumes:
    #   - ./frontend:/app

    depends_on:
      - backend

  database:
    image: postgres:16
    container_name: realestate_db
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: realestate
    
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: